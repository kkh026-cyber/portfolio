<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공부중 | 포트폴리오</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2933;
      --sub: #5f6b7a;
      --line: #e4e7ec;
      --accent: #2f6fed;
      --accent-soft: #e8f0ff;
      --tag-next-bg: #f1f3f5;
      --tag-next-text: #4a5563;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px 64px;
    }

    /* 1) 인사 영역 */
    .hero {
      padding: 96px 0 56px;
    }
    .hero .greeting {
      font-size: 1rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    .hero .intro {
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      color: var(--sub);
    }

    /* 공통 섹션 */
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 28px 30px;
      margin-bottom: 20px;
    }
    section h2 {
      font-size: 1.1rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    section h2::before {
      content: "";
      width: 4px;
      height: 1.1em;
      background: var(--accent);
      border-radius: 2px;
    }

    /* 2) 배우는 것 */
    .tag-group + .tag-group { margin-top: 20px; }
    .tag-label {
      font-size: 0.85rem;
      color: var(--sub);
      margin-bottom: 8px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      list-style: none;
    }
    .tag {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 500;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .tag.next {
      background: var(--tag-next-bg);
      color: var(--tag-next-text);
    }

    /* 3) 목표 */
    .goal p + p { margin-top: 6px; }
    .goal strong { color: var(--accent); }

    /* 4) 연락처 */
    .contact a {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: border-color 0.2s, color 0.2s;
    }
    .contact a:hover,
    .contact a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    /* 스크롤 시 부드럽게 나타나기 */
    .reveal {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    @media (max-width: 480px) {
      .hero { padding: 64px 0 40px; }
      section { padding: 22px 20px 24px; }
    }
  </style>
</head>
<body>
  <main>
    <!-- 1) 인사 영역 -->
    <header class="hero reveal">
      <p class="greeting">안녕하세요,</p>
      <h1>공부중</h1>
      <p class="intro">백엔드 개발자를 준비하는 비전공자</p>
    </header>

    <!-- 2) 배우는 것 -->
    <section class="reveal" aria-labelledby="learning-title">
      <h2 id="learning-title">배우는 것</h2>

      <div class="tag-group">
        <p class="tag-label">지금 배우는 것</p>
        <ul class="tags">
          <li class="tag">LLM 기초</li>
          <li class="tag">Claude AI 프롬프트 작성 실습</li>
          <li class="tag">컨텍스트 엔지니어링</li>
        </ul>
      </div>

      <div class="tag-group">
        <p class="tag-label">앞으로 배울 것</p>
        <ul class="tags">
          <li class="tag next">Python</li>
          <li class="tag next">Java</li>
        </ul>
      </div>
    </section>

    <!-- 3) 목표 -->
    <section class="goal reveal" aria-labelledby="goal-title">
      <h2 id="goal-title">목표</h2>
      <p>서버 개발과 클라우드 서버 운영·최적화에 관심을 두고 공부하고 있습니다.</p>
      <p><strong>6개월 안에 첫 프로젝트를 배포</strong>하는 것이 목표입니다.</p>
      <p>Python과 Java를 차근차근 익혀 직접 만든 서비스를 올려 보려 합니다.</p>
    </section>

    <!-- 4) 연락처 -->
    <section class="contact reveal" aria-labelledby="contact-title">
      <h2 id="contact-title">연락처</h2>
      <!-- 아래 주소의 YOUR_ID를 본인의 GitHub 아이디로 바꿔 주세요 -->
      <a href="https://github.com/YOUR_ID" target="_blank" rel="noopener noreferrer">GitHub 프로필 보기</a>
    </section>
  </main>

  <script>
    // 섹션이 화면에 들어오면 부드럽게 나타나게 한다
    (function () {
      var items = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window)) {
        items.forEach(function (el) { el.classList.add('visible'); });
        return;
      }
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      items.forEach(function (el) { observer.observe(el); });
    })();
  </script>
</body>
</html>
